name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows_contracts:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Agent Docs
        run: dart run tooling/validate_agent_docs.dart

      - name: Validate Localization Contracts
        run: dart run tooling/validate_agent_docs.dart --scope localization

      - name: Agent Docs Validator Tests
        run: dart run test/tooling/validate_agent_docs_test.dart

      - name: Validate Workspace Hygiene
        run: dart run tooling/validate_workspace_hygiene.dart

      - name: Workspace Hygiene Validator Tests
        run: dart run test/tooling/validate_workspace_hygiene_test.dart

      - name: Compile
        run: python -m compileall src tests

      - name: Targeted Core Regressions
        run: python -m pytest -q --durations=10 tests/test_cli_flags.py tests/test_workflow_parallel.py tests/test_run_report.py

  python_shards:
    name: Python 3.11 shard ${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Full Tests (one exhaustive partition)
        run: >-
          python tooling/test_shards.py run
          --shard-count 4 --shard-index ${{ matrix.shard }}
          --timings tooling/test_timings.json
          --output tmp/ci-shard-${{ matrix.shard }} -- tests

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            tmp/ci-shard-${{ matrix.shard }}/plan.json
            tmp/ci-shard-${{ matrix.shard }}/result.json
            tmp/ci-shard-${{ matrix.shard }}/collection/collection.json
            tmp/ci-shard-${{ matrix.shard }}/collection/execution.json
            tmp/ci-shard-${{ matrix.shard }}/collection/stdout.log
            tmp/ci-shard-${{ matrix.shard }}/collection/stderr.log
            tmp/ci-shard-${{ matrix.shard }}/worker-*/collection.json
            tmp/ci-shard-${{ matrix.shard }}/worker-*/execution.json
            tmp/ci-shard-${{ matrix.shard }}/worker-*/junit.xml
            tmp/ci-shard-${{ matrix.shard }}/worker-*/stdout.log
            tmp/ci-shard-${{ matrix.shard }}/worker-*/stderr.log
          if-no-files-found: error
          retention-days: 14

  test:
    # Preserve the existing required branch-protection context.
    name: test (3.11)
    if: always()
    needs: [windows_contracts, python_shards, docs_tooling_contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        if: >-
          needs.windows_contracts.result != 'success' ||
          needs.python_shards.result != 'success' ||
          needs.docs_tooling_contracts.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download every shard's evidence
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-shard-*
          path: tmp/ci-results

      - name: Verify complete coverage exactly once
        run: >-
          python tooling/ci_test_evidence.py
          --artifacts tmp/ci-results --output tmp/ci-verification

      - name: Retain coverage verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage-verification-attempt-${{ github.run_attempt }}
          path: tmp/ci-verification/*.json
          if-no-files-found: warn
          retention-days: 14

  docs_tooling_contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate Agent Docs
        run: dart run tooling/validate_agent_docs.dart

      - name: Validate Workspace Hygiene
        run: dart run tooling/validate_workspace_hygiene.dart

      - name: Agent Docs Validator Tests
        run: dart run test/tooling/validate_agent_docs_test.dart

      - name: Workspace Hygiene Validator Tests
        run: dart run test/tooling/validate_workspace_hygiene_test.dart

      - name: Automation Preflight Tests
        run: dart run test/tooling/automation_preflight_test.dart

      - name: Cloud Eval Preflight Tests
        run: dart run test/tooling/cloud_eval_preflight_test.dart

      - name: Compile
        run: python -m compileall src tests
